name: Build R3G Firmware

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'fanchmwrt branch/tag to build'
        default: 'fanchmwrt-25.12.4'
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Clone fanchmwrt source
        run: |
          git clone --branch "${{ github.event.inputs.ref }}" --single-branch --depth=1 \
            https://github.com/fanchmwrt/fanchmwrt.git openwrt

      - name: Cache downloaded package sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ github.event.inputs.ref }}-${{ hashFiles('configs/r3g.config') }}
          restore-keys: |
            dl-${{ github.event.inputs.ref }}-

      - name: Vendor rtl8188eu package
        run: |
          rm -rf openwrt/package/kernel/rtl8188eu
          cp -r packages/rtl8188eu openwrt/package/kernel/rtl8188eu

      - name: Apply seed config and install feeds
        run: |
          cp configs/r3g.config openwrt/.config
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          # Hard-fail only if a CRITICAL symbol (device profile / Wi-Fi driver /
          # firmware / usb core) was silently dropped by defconfig; for the rest
          # (e.g. usbutils, a diagnostic tool) just warn and keep building.
          CRITICAL="CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g CONFIG_PACKAGE_kmod-rtl8188eu CONFIG_PACKAGE_rtl8188eu-firmware CONFIG_PACKAGE_kmod-usb-core"
          for sym in $(grep -oE '^CONFIG_[A-Za-z0-9_-]+' ../configs/r3g.config); do
            grep -qx "${sym}=y" .config && continue
            case " $CRITICAL " in
              *" $sym "*) echo "::error::critical symbol ${sym} missing from expanded .config"; exit 1 ;;
              *) echo "::warning::${sym} was dropped by defconfig (non-critical, continuing)" ;;
            esac
          done

      - name: Show expanded config (debug)
        working-directory: openwrt
        run: grep -E "TARGET_ramips|kmod-usb|kmod-rtl8188eu|rtl8188eu-firmware|PACKAGE_usbutils" .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: r3g-firmware-${{ github.run_number }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.itb
            openwrt/bin/targets/**/sha256sums
          retention-days: 14
